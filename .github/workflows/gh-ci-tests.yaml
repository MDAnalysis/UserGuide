name: mda_gh_ci_tests
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    # 3 am Tuesdays and Fridays
    - cron: "0 3 * * 2,5"

concurrency:
  # Probably overly cautious group naming.
  # Commits to develop will cancel each other, but PRs will only cancel
  # commits within the same PR
  group: "${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  tests:
    runs-on: ubuntu-latest
    name: "examples-tests"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: ${{ github.event_name != 'schedule' }}
          cache: ${{ github.event_name != 'schedule' }}
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
          environments: ${{ github.event_name != 'schedule' && 'default' || '' }}

      - name: update lock file
        # test against the latest MDAnalysis develop and dependencies
        if: github.event_name == 'schedule'
        run: pixi update -e default -p linux-64

      - name: "environment information"
        run: |
          pixi info
          pixi list -e default

      # These tasks could instead be defined in the pixi.toml file
      - name: "test snapshots"
        working-directory: doc/source/scripts/
        run: pixi run python -m pytest

      - name: "test notebooks"
        working-directory: tests/
        run: pixi run python -m pytest
